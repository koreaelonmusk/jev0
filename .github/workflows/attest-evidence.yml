name: attest-evidence

on:
  workflow_run:
    workflows: [policy-gate]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: jev0-attest-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  attest:
    name: jev0 signed evidence attestation
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SECURITY: this privileged signer executes only code from the default branch.
      # It never checks out, imports, or executes pull-request head content.
      - name: Checkout trusted verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download canonical evidence from policy gate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jev0-range-evidence.json
          path: ${{ runner.temp }}/jev0-attestation-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Download CI provenance from policy gate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jev0-ci-provenance.json
          path: ${{ runner.temp }}/jev0-attestation-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Verify source evidence and provenance before signing
        env:
          INPUT_DIR: ${{ runner.temp }}/jev0-attestation-input
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          EVIDENCE="$INPUT_DIR/jev0-range-evidence.json"
          PROVENANCE="$INPUT_DIR/jev0-ci-provenance.json"
          EXPECTED_WORKFLOW_REF="$REPOSITORY/.github/workflows/policy-gate.yml@refs/heads/$DEFAULT_BRANCH"

          test -f "$EVIDENCE"
          test -f "$PROVENANCE"

          python3 jev0.py provenance-verify "$PROVENANCE" "$EVIDENCE" \
            --require-current-verifier \
            --expect-repository "$REPOSITORY" \
            --expect-workflow-ref "$EXPECTED_WORKFLOW_REF" \
            --expect-run-id "$SOURCE_RUN_ID" \
            --json

      - name: Cryptographically attest verified evidence
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/jev0-attestation-input/jev0-range-evidence.json
          predicate-type: https://github.com/koreaelonmusk/jev0/attestation/provenance/v1
          predicate-path: ${{ runner.temp }}/jev0-attestation-input/jev0-ci-provenance.json
          show-summary: true

      - name: Preserve Sigstore bundle for offline verification
        if: ${{ steps.attest.outputs.bundle-path != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: ${{ steps.attest.outputs.bundle-path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Summarize signed trust root
        env:
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            echo
            echo "### jev0 cryptographic attestation"
            echo
            echo "- attestation id: \`$ATTESTATION_ID\`"
            echo "- attestation url: $ATTESTATION_URL"
            echo "- source policy-gate run: \`${{ github.event.workflow_run.id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
