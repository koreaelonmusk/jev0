name: policy-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: jev0-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: jev0 policy gate
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SECURITY: checkout only the trusted base commit. Never checkout or execute PR head code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Fetch PR head as Git data only
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/jev0/pr-head"
      - name: Verify trusted base policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          HEAD_SHA=$(git rev-parse refs/remotes/jev0/pr-head)
          test "$HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          python3 jev0.py range "$BASE_SHA" "$HEAD_SHA" \
            --base-policy .github/jev0-policy.json
